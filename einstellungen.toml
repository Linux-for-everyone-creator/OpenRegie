# =====================================================================
#  OpenRegie – alle Einstellungen an einer Stelle
# ---------------------------------------------------------------------
#  Hier stehen alle Farben, Texte und Größen.
#  Ändern: Wert rechts vom "=" anpassen, Datei speichern,
#  OpenRegie neu starten.
#  Farben sind Hex-Codes, z. B. "#FF0000" = Rot.
#  Texte immer in "Anführungszeichen".
#  Zugangsdaten (Uno, Twitch) stehen NICHT hier, sondern sicher im
#  Passwortspeicher des Systems.
# =====================================================================


# ---------------------------------------------------------------------
#  OBS (läuft unsichtbar im Hintergrund)
# ---------------------------------------------------------------------
[obs]
# Adresse von OBS. "localhost" heißt: OBS läuft auf diesem PC.
adresse = "localhost"
# 0 = Port automatisch aus den OBS-Einstellungen lesen.
port = 0
# Leer lassen = Passwort automatisch aus den OBS-Einstellungen lesen.
passwort = ""
# Wie oft OpenRegie es neu versucht, wenn OBS nicht erreichbar ist (Sekunden).
neu_verbinden_sekunden = 3
# Befehl, mit dem OpenRegie OBS startet.
startbefehl = "obs"
# true = OBS ohne sichtbares Fenster starten (nur ein Symbol in der Taskleiste).
unsichtbar = true
# Diese Szenensammlung soll in OBS geladen sein. Leer = nichts umschalten.
szenensammlung = "Unbenannt"
# So lange darf OBS zum Starten brauchen, bevor eine Meldung kommt (Sekunden).
start_zeitlimit_sekunden = 30
# true = Beim Schließen von OpenRegie auch das OBS beenden, das OpenRegie gestartet hat.
beim_beenden_schliessen = true
# true = Für jedes Uno-Projekt automatisch eine Browserquelle „Uno: …“ in JEDER Szene anlegen.
uno_in_jede_szene = true
# true = Uno-Quellen liegen in jeder Szene immer ganz oben (sonst verdeckt z. B. die
# Bildschirmaufnahme den Countdown).
overlays_immer_oben = true


# ---------------------------------------------------------------------
#  Live-Vorschau
# ---------------------------------------------------------------------
[vorschau]
# Bilder pro Sekunde. Mehr = flüssiger, aber mehr Rechenlast.
bilder_pro_sekunde = 10
# Breite des Vorschaubilds in Pixeln (Höhe passt sich an).
bildbreite = 960
# Bildqualität 1 bis 100.
qualitaet = 75


# ---------------------------------------------------------------------
#  Overlays.uno (alle Grafiken im Stream kommen von dort)
# ---------------------------------------------------------------------
[uno]
# Adresse des Uno-Servers. Nur ändern, wenn Uno umzieht.
basisadresse = "https://app.overlays.uno"
# Wie oft OpenRegie bei Uno nachschaut, welche Overlays gerade sichtbar sind (Sekunden).
# Uno erlaubt nur 10.000 Anfragen am Tag – darum nicht zu oft (20 s ≈ 4.300 am Tag pro Projekt).
# Nach jedem eigenen Klick stimmt das Tally-Licht sofort.
abfrage_sekunden = 20
# So lange wartet OpenRegie höchstens auf eine Antwort von Uno (Sekunden). Danach gilt Uno
# als „nicht erreichbar“ – das Regiepult bleibt dabei immer bedienbar.
zeitlimit_sekunden = 5
# Längste Countdown-Dauer, die man einstellen kann (Sekunden). 35999 = 9:59:59.
countdown_hoechstdauer_sekunden = 35999


# ---------------------------------------------------------------------
#  Twitch
# ---------------------------------------------------------------------
[twitch]
# Öffentliche Client-ID der OpenRegie-App bei Twitch (dev.twitch.tv → Anwendungen,
# Typ „Öffentlich“). Sie ist kein Geheimnis. Leer = Twitch-Bereich ist aus.
client_id = ""
# Adressen von Twitch. Nur ändern, wenn Twitch umzieht.
anmelde_adresse = "https://id.twitch.tv"
api_adresse = "https://api.twitch.tv/helix"


# ---------------------------------------------------------------------
#  Farben des Regiepults
# ---------------------------------------------------------------------
[farben]
# Grundfarben (dunkles Regiepult)
hintergrund = "#0E1014"
flaeche = "#16191F"
flaeche_hell = "#1E222A"
rahmen = "#272B34"
text = "#F2F4F8"
text_gedimmt = "#8B93A1"
# Gelb des Logos (oben links)
logo = "#F2B035"
logo_symbol = "#16191F"

knopf = "#1E222A"
knopf_text = "#F2F4F8"
# Farbe, wenn der Joystick-Zeiger über einem Knopf ist.
knopf_hover = "#2A2F3A"
knopf_hover_rahmen = "#F2B035"
# Rahmen, wenn ein Knopf mit der Tab-Taste ausgewählt ist.
knopf_fokus_rahmen = "#5B9BFF"
knopf_gedrueckt = "#363C49"
knopf_aus = "#15171C"
knopf_aus_text = "#4D5462"

# Knopf „Einblenden“ und „Ausblenden“
einblenden = "#2EA043"
ausblenden = "#E5484D"
# Knopf „Mit Twitch anmelden“
twitch = "#7A3FE0"

status_verbunden = "#3FB950"
status_verbinde = "#F2B035"
status_getrennt = "#E5484D"

on_air_an = "#E5484D"
on_air_an_text = "#FFFFFF"
on_air_aus = "#2A1416"
on_air_aus_text = "#7A4A4D"
on_air_startet = "#C0611B"

# Lampen der Overlays (Rahmen der Kacheln)
tally_an = "#E5484D"
tally_bereit = "#3FB950"
tally_aus = "#3A3F4B"
# Rahmen der ausgewählten Kachel
kachel_auswahl = "#5B9BFF"

eingabe_hintergrund = "#0B0D10"
auswahl = "#2D6CDF"
meldung_gut = "#3FB950"
meldung_fehler = "#FF6B5E"
# Build-Anzeige unten links (Wasserzeichen wie bei Windows-Vorabversionen)
build_text = "#FFFFFF"


# ---------------------------------------------------------------------
#  Größen im Regiepult (Pixel)
# ---------------------------------------------------------------------
[groessen]
# Schriftart des Regiepults (muss installiert sein, z. B. "Inter" oder "Noto Sans")
schriftart = "Noto Sans"
schrift = 20
schrift_klein = 16
schrift_titel = 30
schrift_eingabe = 22
knopf_hoehe = 72
knopf_breite_min = 110
knopf_rundung = 12
rahmen_dick = 4
abstand = 16
lampe = 36
on_air_breite = 230
on_air_hoehe = 64
schrift_uhr = 44
logo = 64
karten_rundung = 16
bibliothek_breite = 480
kachel_hoehe = 120
kachel_rahmen = 4
schrift_kachel_zeit = 34
schrift_countdown = 64
seitenleiste_breite = 560
eingabe_hoehe = 64
# Deckkraft der Build-Anzeige: 0 = unsichtbar, 1 = voll.
build_deckkraft = 0.35
# Ladebildschirm
start_breite = 760
start_hoehe = 420
start_schrift_name = 72
# Beim Start das ganze Bild ausfüllen? true = ja, false = nein
fenster_maximiert = true
# Fenstergröße, wenn nicht maximiert
fenster_breite = 1600
fenster_hoehe = 900


