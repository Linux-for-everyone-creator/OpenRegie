vorschau_ueberschrift = "Live-Vorschau"
vorschau_keine_verbindung = "Keine Vorschau.\nOBS ist nicht verbunden."
vorschau_wartet = "Vorschau wird geladen …"

countdown_ueberschrift = "Countdown"
